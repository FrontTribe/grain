<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1F6E5B; } a:hover { color: #17513f; }
    .board { width: 1280px; height: 860px; background: #ECE9E1; color: #201D19;
      font-family: "IBM Plex Sans", system-ui, sans-serif; padding: 60px 72px;
      display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .head { display: flex; align-items: center; justify-content: space-between; }
    .head .bm { display: flex; align-items: center; gap: 10px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
    .head .lbl { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #6B655B; }
    .center { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: #B0511C; }
    .lockup { display: flex; align-items: center; gap: 26px; margin: 20px 0 6px; }
    .word { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 150px; letter-spacing: -.05em; line-height: .9; }
    .tag { font-size: 26px; color: #6B655B; max-width: 22ch; margin-top: 14px; }
    .mats { display: flex; gap: 14px; margin-top: 30px; font-family: "IBM Plex Mono", monospace; font-size: 13px; }
    .mat { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; }
    .mat.h { background: #DCEBE4; color: #1F6E5B; } .mat.a { background: #F1E1D2; color: #B0511C; }
    .mat i { width: 10px; height: 10px; border-radius: 3px; } .mat.h i { background: #1F6E5B; } .mat.a i { background: #B0511C; }
    .fp { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 72px 34px; }
    .fp svg { display: block; width: 100%; height: 72px; }
    .fp .cap { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: #948D80; margin-top: 10px; letter-spacing: .04em; }
    .ver { position: absolute; top: 60px; right: 72px; }
  </style>
</helmet>
<div class="board">
  <div class="head">
    <div class="bm">
      <svg viewBox="0 0 120 120" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="28" width="11" height="64" rx="4.5" fill="#1F6E5B"/><rect x="37" y="36" width="11" height="48" rx="4.5" fill="#B0511C"/><rect x="54" y="20" width="11" height="80" rx="4.5" fill="#1F6E5B"/><rect x="71" y="38" width="11" height="44" rx="4.5" fill="#B0511C"/><rect x="88" y="31" width="11" height="58" rx="4.5" fill="#1F6E5B"/></svg>
      grain
    </div>
    <div class="lbl">Brand guidelines · v0.1</div>
  </div>

  <div class="center">
    <div class="eyebrow">Code provenance layer</div>
    <div class="lockup">
      <svg viewBox="0 0 120 120" width="128" height="128" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="28" width="11" height="64" rx="4.5" fill="#1F6E5B"/><rect x="37" y="36" width="11" height="48" rx="4.5" fill="#B0511C"/><rect x="54" y="20" width="11" height="80" rx="4.5" fill="#1F6E5B"/><rect x="71" y="38" width="11" height="44" rx="4.5" fill="#B0511C"/><rect x="88" y="31" width="11" height="58" rx="4.5" fill="#1F6E5B"/></svg>
      <div class="word">grain</div>
    </div>
    <div class="tag">See the grain of your codebase &mdash; how it was made, not just what it is.</div>
    <div class="mats">
      <span class="mat h"><i></i> human = viridian</span>
      <span class="mat a"><i></i> AI-assisted = sienna</span>
    </div>
  </div>

  <div class="fp">
    <svg viewBox="0 0 1040 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="24" width="28" height="72" rx="6" fill="#1F6E5B"/><rect x="46" y="12" width="28" height="96" rx="6" fill="#1F6E5B"/><rect x="86" y="33" width="28" height="54" rx="6" fill="#B0511C"/><rect x="126" y="18" width="28" height="84" rx="6" fill="#1F6E5B"/><rect x="166" y="6" width="28" height="108" rx="6" fill="#1F6E5B"/><rect x="206" y="36" width="28" height="48" rx="6" fill="#C4BCAC"/><rect x="246" y="21" width="28" height="78" rx="6" fill="#1F6E5B"/><rect x="286" y="30" width="28" height="60" rx="6" fill="#B0511C"/><rect x="326" y="15" width="28" height="90" rx="6" fill="#1F6E5B"/><rect x="366" y="9" width="28" height="102" rx="6" fill="#1F6E5B"/><rect x="406" y="38" width="28" height="44" rx="6" fill="#B0511C"/><rect x="446" y="18" width="28" height="84" rx="6" fill="#1F6E5B"/><rect x="486" y="12" width="28" height="96" rx="6" fill="#1F6E5B"/><rect x="526" y="27" width="28" height="66" rx="6" fill="#1F6E5B"/><rect x="566" y="34" width="28" height="52" rx="6" fill="#B0511C"/><rect x="606" y="16" width="28" height="88" rx="6" fill="#1F6E5B"/><rect x="646" y="23" width="28" height="74" rx="6" fill="#1F6E5B"/><rect x="686" y="10" width="28" height="100" rx="6" fill="#1F6E5B"/><rect x="726" y="31" width="28" height="58" rx="6" fill="#C4BCAC"/><rect x="766" y="20" width="28" height="80" rx="6" fill="#1F6E5B"/><rect x="806" y="14" width="28" height="92" rx="6" fill="#1F6E5B"/><rect x="846" y="35" width="28" height="50" rx="6" fill="#B0511C"/><rect x="886" y="18" width="28" height="84" rx="6" fill="#1F6E5B"/><rect x="926" y="25" width="28" height="70" rx="6" fill="#1F6E5B"/><rect x="966" y="11" width="28" height="98" rx="6" fill="#1F6E5B"/><rect x="1006" y="29" width="28" height="62" rx="6" fill="#B0511C"/>
    </svg>
    <div class="cap">The grain fingerprint &mdash; a commit history colored by authorship. The brand's signature graphic.</div>
  </div>
</div>
</x-dc>
</body>
</html>
