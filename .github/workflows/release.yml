name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the release and upload binaries

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          out="grain-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/grain
          echo "ASSET=$out" >> "$GITHUB_ENV"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  # Update the Homebrew tap after all binaries are attached to the release.
  # Requires a repo secret HOMEBREW_TAP_TOKEN (a PAT with contents:write on
  # FrontTribe/homebrew-tap). Without it the job skips gracefully.
  tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -p 'grain-*' -D dist

      - name: Generate formula
        run: GRAIN_ASSET_DIR="$PWD/dist" ./packaging/homebrew/update-formula.sh "${GITHUB_REF_NAME}"

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set — skipping tap update. Add the secret to enable auto-publish."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/FrontTribe/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/grain.rb tap/Formula/grain.rb
          cd tap
          git config user.name "grain-release[bot]"
          git config user.email "release@users.noreply.github.com"
          git add Formula/grain.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged — nothing to push."
          else
            git commit -m "grain ${GITHUB_REF_NAME}"
            git push
          fi
