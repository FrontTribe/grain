# Grain runs on its own pull requests (dogfood). Copy this into your repo to
# get a provenance comment on every PR.
name: Grain

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # post the sticky comment + request reviews
  statuses: write        # set the grain/provenance commit status

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # grain needs base..head history

      - name: Grain provenance
        uses: ./            # in your repo: FrontTribe/grain@v1
        with:
          fail_on: never          # comment only; set to "policy" to gate merges
          comment: 'true'
          status_check: 'true'    # publishes a requireable "grain/provenance" check
          check_registry: 'true'  # ask the registries about dependencies the PR added (names only)
          # security = "block" / dependencies = "block" in .grain.toml fail the check on
          # AI-written security findings or unknown packages; with fail_on: policy that blocks the merge.
          # Route review when an AI-heavy change hits a human-owned path:
          request_review: 'false' # set true and list reviewers to enable
          # reviewers: 'octocat, some-maintainer'
          # review_teams: 'platform-reviewers'
